name: Deploy docs
on:
  push:
    branches: [main]
    paths: ['docs/**']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Cairo/Pango (required by mkdocs-material social plugin)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libpangocairo-1.0-0
      # Pinned: docs/overrides/partials/posthog.html hooks Material's copy-button
      # markup (data-clipboard-target). Re-test install_command_copied before bumping.
      - run: pip install "mkdocs-material[imaging]==9.8.0"
      - run: cd docs && mkdocs gh-deploy --force
